# vibepanel's tmux configuration.
#
# This file is passed as `tmux -f` on every invocation, which means the server
# starts with exactly these settings. We never read ~/.tmux.conf: a user's
# personal status bar, prefix key or mouse mode leaking into panes the web UI
# owns would make the panel behave differently on every machine it is deployed
# to. Determinism here is what makes "scp the binary and run it" work.
#
# Options are grouped by scope because tmux rejects them otherwise:
#   -s  server   -g  global session   -wg  global window

# ── server ────────────────────────────────────────────────────────────────

# Panes get a terminfo that advertises 256 colours; the RGB feature on top of
# it enables 24-bit SGR. Without RGB the Apple palette gets quantised to the
# nearest xterm-256 slot and every carefully chosen colour shifts.
set -s default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# tmux emits OSC 52 to its client (us) whenever something is copied, and we
# forward that to the browser clipboard. Off means copying inside a pane
# silently goes nowhere.
set -s set-clipboard on

# Agent TUIs read Esc directly. tmux's default 500ms wait to disambiguate
# escape sequences makes every Esc press feel like the app has hung.
set -s escape-time 0

# Let applications know when the panel tab is focused.
set -s focus-events on

# Do not let the server exit when the last session is killed; the panel expects
# a stable server it can keep talking to.
set -s exit-empty off

# ── global session ────────────────────────────────────────────────────────

# The browser draws the chrome. A tmux status bar would steal a row and render
# a second, contradictory tab strip inside our own.
set -g status off

# We drive tmux over the CLI, never through keys. Unbinding the prefix
# guarantees a stray Ctrl-B typed at an agent reaches the agent instead of
# opening a tmux command prompt the user cannot see (status is off).
set -g prefix None
set -g prefix2 None

# xterm.js owns the mouse and forwards mouse sequences to the application.
# tmux's own mouse mode would fight it for drag-select.
set -g mouse off

# The bell must arrive at our PTY as a real \007 so the state detector can see
# it. Converting it to a status-line message would drop it on the floor, since
# the status line is off.
set -g visual-bell off
set -g bell-action none

# Replayable scrollback. This is a session option applied at pane creation, so
# it has to live here rather than being set after new-session — otherwise the
# first pane keeps the 2000-line default.
set -g history-limit 20000

# Sessions must survive the panel restarting; never destroy on detach.
set -g destroy-unattached off

# ── global window ─────────────────────────────────────────────────────────

# Size follows whichever client was last active. The panel attaches exactly one
# client per session and drives its size from Go, so "latest" is always us —
# a phone viewing a session cannot shrink the grid under a desktop mid-edit,
# because the phone is not a tmux client at all.
#
# This should be "manual", which is what the semantics above actually describe.
# It is not, because `window-size manual` segfaults the tmux 3.6 server the
# moment it spawns a window: the server dies inside spawn_window() and every
# command afterwards reports "server exited unexpectedly". Verified against
# tmux 3.6 with and without -x/-y and with an explicit default-size; all crash.
# If you are tempted to change this back, reproduce first:
#   tmux -L probe -f <(echo 'setw -g window-size manual') new-session -d /bin/sleep 5
setw -g window-size latest

# Applications set the pane title via OSC 0/2. This is how sessions get useful
# names for free; without it every tab reads "bash" and the user names all of
# them by hand.
setw -g allow-set-title on
setw -g automatic-rename off

# Agent TUIs emit sequences tmux does not model (progress bars, OSC 9
# notifications). Passthrough keeps them intact instead of being swallowed.
setw -g allow-passthrough on

# Required for window_bell_flag to be maintained, which the state detector
# polls as a second bell signal alongside the raw \007.
setw -g monitor-bell on

# Keep a dead pane on screen with its final output. When an agent crashes the
# traceback is the most valuable thing in the session; letting the pane vanish
# throws it away.
setw -g remain-on-exit on
