# vibepanel's tmux configuration.
#
# This file is passed as `tmux -f` on every invocation, which means the server
# starts with exactly these settings. We never read ~/.tmux.conf: a user's
# personal status bar, prefix key or mouse mode leaking into panes the web UI
# owns would make the panel behave differently on every machine it is deployed
# to. Determinism here is what makes "scp the binary and run it" work.
#
# Options are grouped by scope because tmux rejects them otherwise:
#   -s  server   -g  global session   -wg  global window

# ── server ────────────────────────────────────────────────────────────────

# Panes get a terminfo that advertises 256 colours; the RGB feature on top of
# it enables 24-bit SGR. Without RGB the Apple palette gets quantised to the
# nearest xterm-256 slot and every carefully chosen colour shifts.
set -s default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# tmux emits OSC 52 to its client (us) whenever something is copied, and we
# forward that to the browser clipboard. Off means copying inside a pane
# silently goes nowhere.
set -s set-clipboard on

# Agent TUIs read Esc directly. tmux's default 500ms wait to disambiguate
# escape sequences makes every Esc press feel like the app has hung.
set -s escape-time 0

# Let applications know when the panel tab is focused.
set -s focus-events on

# Do not let the server exit when the last session is killed; the panel expects
# a stable server it can keep talking to.
set -s exit-empty off

# ── global session ────────────────────────────────────────────────────────

# The browser draws the chrome. A tmux status bar would steal a row and render
# a second, contradictory tab strip inside our own.
set -g status off

# We drive tmux over the CLI, never through keys. Unbinding the prefix
# guarantees a stray Ctrl-B typed at an agent reaches the agent instead of
# opening a tmux command prompt the user cannot see (status is off).
set -g prefix None
set -g prefix2 None

# xterm.js owns the mouse and forwards mouse sequences to the application.
# tmux's own mouse mode would fight it for drag-select.
set -g mouse off

# Draw on the primary screen, not the alternate one.
#
# This is what makes scrollback exist in the browser at all. The first thing a
# tmux client writes to its terminal is ESC[?1049h — measured, it is literally
# the first chunk on this PTY:
#
#   "\x1b[?1049h\x1b[22;0;0t\x1b[?1h\x1b=\x1b[H\x1b[2J..."
#
# So everything the panel had ever rendered was on xterm.js's alternate buffer,
# which has no scrollback by definition. tmux holds 20,000 lines per session and
# not one of them could be reached, on any device. Read out of xterm's own
# buffer: 0 lines of scrollback before this line, 269 after.
#
# The alternate screen exists so a program that exits can put back what was on
# the terminal before it started. This PTY is created for one tmux client and
# dies with it; there is nothing behind it to restore. Programs running *inside*
# tmux are unaffected, because tmux emulates the alternate screen per pane and
# sends the composed result — leaving vim still restores the shell, which
# stress-check has always pinned and still does.
#
set -ga terminal-overrides ',*:smcup@:rmcup@'

# Scroll the screen with line feeds rather than CSI Ps S.
#
# The other half, and it is not optional. tmux optimises a scroll into SU —
# measured at the byte level on this socket:
#
#   "\x1b[12S\x1b[HROW_12\r\nROW_13\r\n..."
#
# A terminal scrolling by SU discards what goes off the top; only a line feed
# at the bottom margin puts a line into the scrollback. With the alternate
# screen gone but SU still in use, twelve batches of ten wheel notches reach
# nothing, three runs out of three.
#
# One run said otherwise, and it was the first version of that check reading a
# picture that was still moving. It nearly took this line out.
#
# Only `indn` and `smcup`/`rmcup`. Nothing else about the drawing changes.
set -ga terminal-overrides ',*:indn@'

# The bell must arrive at our PTY as a real \007: without hooks it is the only
# unambiguous "an agent wants a human" signal there is, and surfacing that is
# the panel's whole reason to exist.
#
# visual-bell off keeps it a control character rather than a status-line
# message — and the status line is off, so a message would go nowhere.
#
# bell-action must NOT be "none". Despite reading like "do not react", it stops
# tmux forwarding the bell to its client entirely: the text around it arrives
# and the \007 is dropped. Verified by capturing the client PTY under each
# value — none and "other" yield zero bells, "any" and "current" yield one.
# "any" rather than "current" because a session the user is not looking at is
# exactly the one whose bell matters most.
set -g visual-bell off
set -g bell-action any

# Replayable scrollback. This is a session option applied at pane creation, so
# it has to live here rather than being set after new-session — otherwise the
# first pane keeps the 2000-line default.
set -g history-limit 20000

# Sessions must survive the panel restarting; never destroy on detach.
set -g destroy-unattached off

# ── global window ─────────────────────────────────────────────────────────

# Size follows whichever client was last active. The panel attaches exactly one
# client per session and drives its size from Go, so "latest" is always us —
# a phone viewing a session cannot shrink the grid under a desktop mid-edit,
# because the phone is not a tmux client at all.
#
# This should be "manual", which is what the semantics above actually describe.
# It is not, because `window-size manual` segfaults the tmux 3.6 server the
# moment it spawns a window: the server dies inside spawn_window() and every
# command afterwards reports "server exited unexpectedly". Verified against
# tmux 3.6 with and without -x/-y and with an explicit default-size; all crash.
# If you are tempted to change this back, reproduce first:
#   tmux -L probe -f <(echo 'setw -g window-size manual') new-session -d /bin/sleep 5
setw -g window-size latest

# Applications set the pane title via OSC 0/2. This is how sessions get useful
# names for free; without it every tab reads "bash" and the user names all of
# them by hand.
#
# Guarded by version because the option does not exist below 3.6 and tmux
# rejects the whole line there. Measured: tmux 3.4 -- which is what Ubuntu
# 24.04 LTS ships -- answers `invalid option: allow-set-title`, and CI on that
# version failed fourteen tmux and session tests before this guard existed. The
# default is `on` wherever the option exists (verified on 3.6 against a server
# started with -f /dev/null), so skipping it below 3.6 changes no behaviour at
# all; the line is an assertion against a future default flipping, not
# configuration, and an assertion is not worth breaking a supported tmux over.
%if "#{>=:#{version},3.6}"
setw -g allow-set-title on
%endif
setw -g automatic-rename off

# Agent TUIs emit sequences tmux does not model (progress bars, OSC 9
# notifications). Passthrough keeps them intact instead of being swallowed.
setw -g allow-passthrough on

# Keeps tmux tracking bells per window, and that tracking is load-bearing.
#
# Not a second signal while anyone is watching: under bell-action "any" tmux
# forwards the bell to its client, and the raw \007 arriving on the panel's PTY
# is what the scanner picks up. That is the signal in normal running.
#
# It is the *only* signal at startup, before anything has attached. tmux
# latches window_bell_flag when there is no client to forward to, and the
# panel reads it once during reconciliation to recover a bell that rang while
# it was down — the one moment nobody was watching. Measured under this config,
# no client attached: the flag reads 1, and attaching clears it to 0.
#
# This comment used to say "nothing polls window_bell_flag". Something does,
# and TestTheBellFlagLatchesWhenNobodyIsAttached fails if this line is turned
# off, or a future tmux stops latching.
#
# That test pins this option and not bell-action above, which is the correct
# split and was worth checking rather than assuming: bell-action decides
# whether a bell is forwarded to an attached client, not whether the flag
# latches when there is none, so setting it to "none" leaves this test green.
# What that setting breaks is the live signal, and the render check's bell
# session is what catches it.
setw -g monitor-bell on

# Keep a dead pane on screen with its final output. When an agent crashes the
# traceback is the most valuable thing in the session; letting the pane vanish
# throws it away.
setw -g remain-on-exit on
