<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The same thing in the spelling that is not vendor-prefixed. Chrome
         warns that the apple- one is deprecated and reads this instead; Safari
         reads the one above. Both, because both are still consulted, and a
         page that only carries the legacy name is one browser away from being
         a bookmark rather than an installed app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d0d10" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- Themes installed as plugins, as one stylesheet the panel serves
         (docs/plugins.md §5). A link rather than something React injects,
         so a chosen plugin theme is in the document before first paint like
         the panel's own; the route answers an empty sheet when nothing is
         installed, and 401 on the sign-in page, which the browser ignores. -->
    <link rel="stylesheet" href="/plugin-themes.css" />
    <title>vibepanel</title>
    <style>
      .vp-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8eaed;
      }
      .vp-boot-dot {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        border: 3px solid rgb(0 0 0 / 0.12);
        border-top-color: #007aff;
        animation: vp-boot-spin 900ms linear infinite;
      }
      @keyframes vp-boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .vp-boot { background: #0d0d10; }
        :root:not([data-theme='light']) .vp-boot-dot {
          border-color: rgb(255 255 255 / 0.14);
          border-top-color: #0a84ff;
        }
      }
      :root[data-theme='dark'] .vp-boot { background: #0d0d10; }
      :root[data-theme='dark'] .vp-boot-dot {
        border-color: rgb(255 255 255 / 0.14);
        border-top-color: #0a84ff;
      }
      /* Somebody who asked for no motion gets a dot rather than nothing: the
         point is "something is happening", and a still ring says that too. */
      @media (prefers-reduced-motion: reduce) {
        .vp-boot-dot { animation: none; }
      }
      /* What replaces the dot when the panel cannot start. Plain properties
         only: this is what an old browser draws. */
      .vp-boot-note {
        flex-direction: column;
        padding: 0 24px;
        text-align: center;
        font: 16px/1.5 system-ui, -apple-system, sans-serif;
        color: #1d1d1f;
      }
      .vp-boot-note p { max-width: 28em; margin: 0 0 12px; }
      .vp-boot-note button { font: inherit; padding: 6px 16px; }
      @media (prefers-color-scheme: dark) {
        .vp-boot-note { color: #f5f5f7; }
      }
    </style>
    <script>
      // Applied before first paint. Reading the stored theme in React instead
      // would show one frame of the wrong palette on every load — the flash is
      // brief, but on a dark-room phone it is genuinely unpleasant.
      try {
        var t = localStorage.getItem('vibepanel.theme')
        // 'light', 'dark', or a plugin theme's 'ext-<id>' (theme.ts owns the
        // shape); 'system' sets nothing.
        // ?safe=1 is the way back from a plugin that broke the page
        // (docs/plugins.md §7): no plugin theme and no module for this tab.
        var safe = /[?&]safe=1(&|$)/.test(location.search)
        if (t === 'light' || t === 'dark' || (!safe && /^ext-[a-z0-9-]+$/.test(t))) document.documentElement.dataset.theme = t
      } catch (e) { /* private mode: fall through to the system preference */ }
    </script>
    <script type="module" crossorigin src="/assets/index-DdxVd3Lc.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D5My_3iT.css">
  </head>
  <body>
    <!-- What is on screen before any of this has loaded.
      
         In a browser tab the gap is a white flash nobody mentions. Installed to
         a home screen it is the whole experience: the platform paints its
         splash from the manifest -- background colour, icon, name -- and then
         takes it away the moment the document exists, which is long before the
         bundle has parsed. What was left was the icon sitting on an empty
         page. 「在 PWA 模式下加载资源的时候，不会弹出咱们的加载动画，只会把那个
         logo 放在屏幕上」.
      
         Inline, and with its own colours, because the stylesheet is one of the
         things being waited for: a loader that needs styles.css cannot cover
         the time before styles.css. The two values are --vp-bg from the light
         and dark palettes, and they are the only place in the project those
         are written twice -- the alternative is a loader that flashes white on
         a dark device, which is what this is for.
      
         React replaces the contents of #root on mount, so it needs no removing.
      -->
    <div id="root">
      <div class="vp-boot" role="status" aria-label="Loading">
        <div class="vp-boot-dot"></div>
      </div>
    </div>
    <noscript>
      <div class="vp-boot vp-boot-note">
        <p>vibepanel needs JavaScript. · vibepanel 需要 JavaScript。</p>
      </div>
    </noscript>
    <!-- A browser that cannot run the panel used to keep the dot spinning
         forever: nothing said why, and nothing happened. Two cases.
         Too old: below Safari 16.4, Chrome 111 or Firefox 128 the stylesheet's
         container queries and color-mix are dropped and the layout falls
         apart rather than degrading, and below ES modules nothing runs at all.
         Checked here, in a classic script every browser runs; the bundle is
         told not to start (main.tsx reads data-vp-unsupported).
         Failed: a script error before the app has drawn anything -- a bundle
         the engine cannot parse, or one that did not load -- leaves the dot
         where it is. Once the app is on screen this does nothing; the app's
         own error boundaries own that. -->
    <script>
      (function () {
        var zh = /^zh/i.test(navigator.language || '')
        function booting() {
          var root = document.getElementById('root')
          return root && root.querySelector('.vp-boot') ? root : null
        }
        function say(text, reload) {
          var root = booting()
          if (!root) return
          var box = document.createElement('div')
          box.className = 'vp-boot vp-boot-note'
          box.setAttribute('role', 'alert')
          box.setAttribute('data-testid', reload ? 'boot-failed' : 'boot-unsupported')
          var p = document.createElement('p')
          p.textContent = text
          box.appendChild(p)
          if (reload) {
            var b = document.createElement('button')
            b.type = 'button'
            b.textContent = zh ? '重新加载' : 'Reload'
            b.onclick = function () { location.reload() }
            box.appendChild(b)
          }
          root.innerHTML = ''
          root.appendChild(box)
        }
        var css = window.CSS && CSS.supports
        var ok = !!css &&
          CSS.supports('container-type: inline-size') &&
          CSS.supports('color', 'color-mix(in srgb, red, blue)') &&
          'noModule' in document.createElement('script')
        if (!ok) {
          document.documentElement.setAttribute('data-vp-unsupported', '1')
          var show = function () {
            say(zh
              ? '这个浏览器版本太旧，打不开面板。需要 Safari 16.4、Chrome 111、Firefox 128 或更新的版本。'
              : 'This browser is too old for the panel. It needs Safari 16.4, Chrome 111, Firefox 128 or later.', false)
          }
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show)
          else show()
          return
        }
        window.addEventListener('error', function (e) {
          // A script that threw or did not parse, or the bundle's own tag
          // failing to load. Not a stylesheet or an image: those also land
          // here in the capture phase, and none of them stops the panel.
          var t = e.target
          var script = t && t.tagName === 'SCRIPT'
          if (!(e instanceof ErrorEvent) && !script) return
          say(zh ? '面板没能启动。' : 'The panel did not start.', true)
        }, true)
      })()
    </script>
  </body>
</html>
