<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%230A84FF'/%3E%3Cg%20fill='%23fff'%3E%3Crect%20x='13'%20y='17'%20width='26'%20height='6'%20rx='3'/%3E%3Crect%20x='13'%20y='29'%20width='34'%20height='6'%20rx='3'/%3E%3Crect%20x='13'%20y='41'%20width='20'%20height='6'%20rx='3'/%3E%3C/g%3E%3Cpath%20d='M50%2015L56%2025.5H44Z'%20fill='%23FF9F0A'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session wall</title>
  <style>
    :root {
      --bg: #101010;
      --panel: #121212;
      --line: #262626;
      --text: #ededed;
      --muted: #a0a0a0;
      --accent: #a3a3a3;
      --working: #7cace0;
      --waiting: #e7b45b;
      --done: #75b58e;
      --urgent: #ef9588;
      --crashed: #ef9588;
      --vp-live: #75b58e;
      --vp-waiting: #e7b45b;
      --vp-trouble: #ef9588;
      --row-height: 76px;
      font-size: clamp(16px, 1.04vw, 24px);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      margin: 0 auto;
      max-width: 1920px;
      padding: clamp(24px, 2.5vw, 64px);
      background: var(--bg);
      color: var(--text);
      font: 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 32px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .shape { width: 1em; height: 1em; flex: none; display: block; }
    .name { unicode-bidi: isolate; }
    header { display: flex; align-items: center; gap: 24px; min-width: 0; }
    header .titles { min-width: 0; flex: 1; }
    h1 { margin: 0; font-size: 1.6rem; font-weight: 600; letter-spacing: -0.025em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { margin-top: 6px; color: var(--muted); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #status { padding: 5px 12px; border: 1px solid var(--line); border-radius: 99px;
      font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
    #status[data-vp-status="live"] { color: var(--done); border-color: color-mix(in srgb, var(--done) 20%, var(--line));
      background: color-mix(in srgb, var(--done) 7%, var(--bg)); }
    main { position: relative; display: grid; min-height: 0;
      grid-template-columns: minmax(0, 1.8fr) minmax(300px, 1fr);
      grid-template-rows: auto minmax(0, 1fr); gap: 28px 32px; }
    section { min-height: 0; min-width: 0; }
    h2 { margin: 0; font-size: 1rem; font-weight: 550; letter-spacing: -0.02em; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .section-heading span { color: var(--muted); font-size: 0.8rem; }
    .overview { grid-column: 1 / -1; }
    .hero { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
      border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
    .metric { min-width: 0; padding: 20px 24px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .label { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 0.85rem; }
    .label .shape { font-size: 0.7rem; }
    .n { display: block; margin-top: 8px; font-size: 2.25rem; line-height: 1.1; font-weight: 550;
      letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .detail { display: block; color: var(--muted); font-size: 0.8rem; margin-top: 8px; min-height: 21px; }
    .oldest b { color: var(--text); font-weight: 500; margin-left: 5px; font-variant-numeric: tabular-nums; }
    .alarm { display: none; align-items: center; gap: 6px; margin-top: 8px; font-size: 0.8rem; color: var(--urgent); }
    .waiting.urgent { box-shadow: inset 0 2px var(--urgent); }
    .waiting.urgent .n { color: var(--urgent); }
    .waiting.urgent .alarm { display: flex; }
    .sessions, .changes { display: flex; flex-direction: column; }
    .session-table { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .table-heading, .tile { display: grid; grid-template-columns: minmax(0, 1fr) 7.5rem 4rem; align-items: center; gap: 20px; padding: 0 24px; }
    .table-heading { min-height: 48px; flex: none; font-size: 0.8rem; color: var(--muted); border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 3%, var(--bg)); }
    .table-heading span:last-child { text-align: right; }
    #tiles { min-height: 0; overflow: hidden; }
    .tile { min-height: var(--row-height); border-bottom: 1px solid var(--line); }
    .tile:last-child { border-bottom: 0; }
    .tile .identity { min-width: 0; }
    .tile .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .kind { display: block; color: var(--muted); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .state { display: flex; align-items: center; gap: 7px; width: fit-content; padding: 3px 9px;
      font-size: 0.8rem; line-height: 1.4; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 17%, transparent);
      border-radius: 5px; background: color-mix(in srgb, var(--c) 6%, transparent); }
    .tile .state .shape { font-size: 0.6rem; }
    .tile .dur { text-align: right; font-size: 0.85rem; color: var(--text); opacity: 0.78; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .tile.waiting-tile { background: color-mix(in srgb, var(--waiting) 4%, var(--bg)); }
    .tile.more { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.8rem; }
    .tile.more .breakdown { display: flex; align-items: center; gap: 8px; }
    .empty { color: var(--muted); display: flex; align-items: center; gap: 10px; padding: 28px 24px; }
    #feed { list-style: none; margin: 0; padding: 0 22px; min-height: 0; overflow: hidden;
      border: 1px solid var(--line); border-radius: 8px; }
    #feed li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
      padding: 18px 0; border-bottom: 1px solid var(--line); }
    #feed li:last-child { border-bottom: 0; }
    #feed .shape { font-size: 0.75rem; grid-row: span 2; }
    #feed .primary { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; font-weight: 500; }
    #feed .meta { color: var(--muted); font-size: 0.8rem; grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #feed .ago { color: var(--muted); font-size: 0.75rem; grid-row: 1; grid-column: 3; font-variant-numeric: tabular-nums; white-space: nowrap; }
    /* The notice stays explicit so a disconnected screen cannot look like a quiet queue. */
    #notice { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; pointer-events: none; }
    #notice span { background: var(--panel); border: 1px solid var(--vp-trouble); border-radius: 8px;
      padding: 20px 28px; font-size: 18px; text-align: center; max-width: 80%; }
    body.offline main > section { opacity: 0.3; filter: grayscale(1); }
    @media (min-width: 2200px) {
      :root { --row-height: 96px; }
      body { max-width: 2560px; }
    }
    @media (max-width: 1000px), (max-height: 700px) {
      html, body { height: auto; min-height: 100%; }
      body { overflow: visible; display: block; }
      header { margin-bottom: 32px; }
      main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; gap: 28px; }
      .overview { grid-column: auto; }
      .session-table, #tiles { overflow: visible; }
      #feed { max-height: 480px; }
    }
    @media (max-width: 600px) {
      :root { --row-height: 68px; }
      body { padding: 24px 18px; }
      header { align-items: flex-start; gap: 12px; }
      h1 { font-size: 23px; }
      .sub { font-size: 14px; }
      #status { margin-top: 3px; font-size: 13px; padding: 3px 7px; }
      .hero { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { padding: 18px; border-bottom: 1px solid var(--line); }
      .metric:nth-child(even) { border-right: 0; }
      .metric:last-child { border-bottom: 0; grid-column: 1 / -1; }
      .hero:has(#crashedBox:not([hidden])) .metric:last-child { grid-column: auto; }
      .hero:has(#crashedBox:not([hidden])) #crashedBox { border-bottom: 0; }
      .n { font-size: 32px; }
      .table-heading, .tile { grid-template-columns: minmax(0, 1fr) 82px 48px; gap: 10px; padding-left: 14px; padding-right: 14px; }
      .tile .state { font-size: 13px; gap: 5px; padding: 2px 5px; }
      .tile .dur { font-size: 13px; }
      #feed { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="titles">
      <h1 id="title">Sessions</h1>
      <div class="sub" id="sub"></div>
    </div>
    <span id="status"></span>
  </header>

  <main>
    <div id="notice" hidden><span></span></div>
    <section class="overview">
      <div class="section-heading"><h2>Overview</h2></div>
      <div class="hero">
        <div class="metric waiting" id="waitingBox">
          <div class="label" data-shape="waiting">Waiting</div>
          <div class="n" id="waiting">—</div>
          <div class="detail oldest" id="oldest"></div>
          <div class="alarm" id="alarm"></div>
        </div>
        <div class="metric"><div class="label" data-shape="working">Working</div><span class="n" id="working">—</span><span class="detail">In progress</span></div>
        <div class="metric" id="crashedBox" hidden><div class="label" data-shape="crashed">Crashed</div><span class="n" id="crashed">0</span><span class="detail">Exited with an error</span></div>
        <div class="metric"><div class="label" data-shape="done">Done</div><span class="n" id="done">—</span><span class="detail" id="doneToday"></span></div>
      </div>
    </section>

    <section class="sessions">
      <div class="section-heading"><h2>Sessions</h2><span id="sessionCount"></span></div>
      <div class="session-table" role="table" aria-label="Sessions">
        <div class="table-heading" role="row"><span role="columnheader">Session</span><span role="columnheader">Status</span><span role="columnheader">Duration</span></div>
        <div id="tiles" role="rowgroup"></div>
      </div>
    </section>

    <section class="changes">
      <div class="section-heading"><h2>Recent changes</h2></div>
      <ul id="feed"></ul>
    </section>
  </main>

  <script src="vibepanel.js"></script>
  <script>
    const vp = VibePanel.connect()
    vp.badge(document.getElementById('status'))

    const $ = (id) => document.getElementById(id)
    const params = { warnAt: 3 }

    // Shape as well as colour: circle working, triangle waiting, check done,
    // cross crashed. The panel draws the same four.
    const SVG = 'http://www.w3.org/2000/svg'
    const SHAPES = {
      waiting: ['path', { d: 'M12 2.5 L22.5 21 H1.5 Z', fill: 'currentColor' }],
      working: ['circle', { cx: 12, cy: 12, r: 9.5, fill: 'currentColor' }],
      done: ['path', { d: 'M3.5 12.5 L9.5 18.5 L20.5 5.5', fill: 'none', stroke: 'currentColor',
        'stroke-width': 3.6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }],
      crashed: ['path', { d: 'M5 5 L19 19 M19 5 L5 19', fill: 'none', stroke: 'currentColor',
        'stroke-width': 3.6, 'stroke-linecap': 'round' }],
      alarm: ['path', { d: 'M12 2.5 L22.5 21 H1.5 Z M12 9 V14 M12 17.2 V17.4', fill: 'none', stroke: 'currentColor',
        'stroke-width': 2.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }],
    }
    const COLOUR = { waiting: 'var(--waiting)', working: 'var(--working)', done: 'var(--done)', crashed: 'var(--crashed)' }

    // The state enum has no "crashed": a process that exited non-zero keeps
    // whatever state it died in, usually done, and is told apart by `exited` and
    // its status. -1 is a tmux session that vanished, which nobody saw fail.
    const crashed = (row) => Boolean(row.exited) && row.exitStatus !== 0 && row.exitStatus !== -1
    const shown = (row) => (crashed(row) ? 'crashed' : row.state)

    function shape(state) {
      const [tag, attrs] = SHAPES[state] || SHAPES.done
      const svg = document.createElementNS(SVG, 'svg')
      svg.setAttribute('class', 'shape')
      svg.setAttribute('viewBox', '0 0 24 24')
      svg.setAttribute('aria-hidden', 'true')
      const mark = document.createElementNS(SVG, tag)
      for (const [k, v] of Object.entries(attrs)) mark.setAttribute(k, String(v))
      svg.append(mark)
      if (COLOUR[state]) svg.style.color = COLOUR[state]
      return svg
    }

    function el(tag, className, text) {
      const node = document.createElement(tag)
      if (className) node.className = className
      if (text !== undefined) vp.text(node, text)
      return node
    }

    // The static shapes in the markup.
    for (const slot of document.querySelectorAll('[data-shape]')) slot.prepend(shape(slot.dataset.shape))
    $('alarm').append(shape('alarm'), el('span'))

    vp.on('params', (p) => {
      if (typeof p.accent === 'string') document.documentElement.style.setProperty('--accent', p.accent)
      if (typeof p.warnAt === 'number') params.warnAt = p.warnAt
      params.title = p.title
      if (vp.snapshot) draw(vp.snapshot)
    })

    const OFFLINE = {
      disconnected: 'Not live. These are the last numbers the panel sent.',
      revoked: 'This link no longer works',
    }
    vp.on('status', (st) => {
      document.body.classList.toggle('offline', Boolean(OFFLINE[st]))
      $('notice').hidden = !OFFLINE[st]
      $('notice').firstChild.textContent = OFFLINE[st] || ''
    })

    // Waiting first and oldest first: the tile that has waited longest is the
    // one somebody should walk over for. Done last, most recent first.
    const ORDER = { waiting: 0, crashed: 1, working: 2, done: 3 }
    function sortSessions(rows) {
      return rows.slice().sort((a, b) =>
        (ORDER[shown(a)] - ORDER[shown(b)]) ||
        (shown(a) === 'done' || shown(a) === 'crashed' ? b.stateChangedAt - a.stateChangedAt : a.stateChangedAt - b.stateChangedAt))
    }

    // Keep rows at a readable height. A wall has no scrollbar to operate,
    // so overflow is counted in a final row instead of shrinking every name.
    function fitRows(box, n) {
      const rowHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row-height'))
      const section = box.closest('section')
      const heading = section.querySelector('.section-heading')
      const tableHeading = section.querySelector('.table-heading')
      const available = section.clientHeight - heading.offsetHeight - 16 - tableHeading.offsetHeight - 2
      return Math.min(n, Math.max(1, Math.floor(available / rowHeight)))
    }

    function tile(row) {
      const st = shown(row)
      const t = el('div', `tile ${st}-tile`)
      t.setAttribute('role', 'row')
      t.style.setProperty('--c', COLOUR[st] || 'var(--muted)')
      const identity = el('div', 'identity')
      identity.setAttribute('role', 'cell')
      const exited = st === 'crashed' ? ` · exited ${row.exitStatus}` : row.exited ? ' · exited' : ''
      const name = vp.name(row)
      identity.append(el('span', 'name', name || `${row.kind} session`))
      if (name || exited) identity.append(el('span', 'kind', `${name ? row.kind : ''}${exited}`.replace(/^ · /, '')))
      const state = el('span', 'state')
      state.setAttribute('role', 'cell')
      state.append(shape(st), el('span', null, WORD[st]))
      const duration = el('span', 'dur', vp.since(row.stateChangedAt))
      duration.setAttribute('role', 'cell')
      t.append(identity, state, duration)
      return t
    }

    function moreTile(hidden) {
      const t = el('div', 'tile more')
      t.append(el('span', null, `+${hidden.length} more`))
      const top = el('div', 'breakdown')
      for (const state of ['waiting', 'crashed', 'working', 'done']) {
        const n = hidden.filter((r) => shown(r) === state).length
        if (n) top.append(shape(state), el('span', null, n))
      }
      t.append(top)
      return t
    }

    function drawTiles(sessions) {
      const box = $('tiles')
      box.replaceChildren()
      if (!sessions.length) {
        const empty = el('div', 'empty')
        empty.append(shape('done'), el('span', null, 'Nothing is running.'))
        box.append(empty)
        return
      }
      const rows = sortSessions(sessions)
      const narrow = matchMedia('(max-width: 1000px), (max-height: 700px)').matches
      const fits = narrow ? rows.length : fitRows(box, rows.length)
      const overflow = fits < rows.length
      const visible = overflow ? rows.slice(0, fits - 1) : rows
      for (const row of visible) box.append(tile(row))
      if (overflow) box.append(moreTile(rows.slice(fits - 1)))
    }

    const WORD = { waiting: 'waiting', working: 'working', done: 'done', crashed: 'crashed' }
    // The log records states, and a crash is logged as the move to done. The
    // newest move into a crashed session's current state is the crash.
    function drawFeed(feed, sessions) {
      const dead = new Map(sessions.filter(crashed).map((r) => [r.id, r]))
      const list = $('feed')
      list.replaceChildren()
      const entries = feed ? feed.entries.slice(0, 40) : []
      if (!entries.length) {
        list.append(el('li', 'meta', 'No changes yet.'))
        return
      }
      for (const e of entries) {
        const li = el('li')
        const name = vp.name(e)
        const row = dead.get(e.sessionId)
        let to = e.to
        if (row && row.state === e.to) { to = 'crashed'; dead.delete(e.sessionId) }
        const move = `${WORD[e.from] || e.from} → ${WORD[to] || to}`
        // forSeconds is how long it spent in the state it just left.
        const after = `after ${vp.fmt.duration(e.forSeconds)}`
        const primary = el('span', 'primary name', name || move)
        const meta = el('span', 'meta', name ? `${move} · ${after}` : after)
        li.append(shape(to), primary, el('span', 'ago', `${vp.since(e.at)} ago`), meta)
        list.append(li)
      }
    }

    function draw(s) {
      const c = s.counts
      vp.text($('title'), params.title || s.name, 'Sessions')
      const bits = [`${c.sessions} sessions`, `${c.projects} projects`]
      if (s.remark) bits.push(s.remark)
      vp.text($('sub'), bits.join(' · '))
      vp.text($('sessionCount'), `${c.sessions} total`)

      // Crashed sessions are counted on their own and taken out of the state
      // they died in. Without the rows (a link that lists none) only the
      // totals are known, and a crash is taken out of done.
      const n = { waiting: c.waiting, working: c.working, done: c.done, crashed: 0 }
      if (s.sessions.length === c.sessions) {
        for (const r of s.sessions.filter(crashed)) { n.crashed++; if (n[r.state] > 0) n[r.state]-- }
      } else {
        n.crashed = c.crashed
        n.done = Math.max(0, c.done - c.crashed)
      }
      vp.text($('waiting'), n.waiting)
      vp.text($('working'), n.working)
      vp.text($('done'), n.done)
      vp.text($('crashed'), n.crashed)
      $('crashedBox').hidden = n.crashed === 0
      vp.text($('doneToday'), `${c.doneToday} today`)
      if (c.waiting > 0 && c.longestWaitAt > 0) {
        $('oldest').replaceChildren('Longest wait', el('b', null, vp.since(c.longestWaitAt)))
      } else {
        vp.text($('oldest'), 'No sessions waiting')
      }
      const urgent = c.waiting >= params.warnAt
      $('waitingBox').classList.toggle('urgent', urgent)
      vp.text($('alarm').lastChild, `${params.warnAt} or more waiting`)

      drawTiles(s.sessions)
      drawFeed(s.feed, s.sessions)
    }

    vp.on('snapshot', draw)
    // Refit when the screen changes size; a wall rotated or a window resized.
    addEventListener('resize', () => { if (vp.snapshot) draw(vp.snapshot) })
  </script>
</body>
</html>
