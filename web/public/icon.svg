<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="vibepanel">
  <!-- A list of sessions, one of which needs you. That is the whole product,
       and it is the only part that survives being drawn at 16 pixels. -->
  <rect width="64" height="64" rx="14" fill="#0A84FF"/>
  <g fill="#fff">
    <rect x="13" y="17" width="26" height="6" rx="3"/>
    <rect x="13" y="29" width="34" height="6" rx="3"/>
    <rect x="13" y="41" width="20" height="6" rx="3"/>
  </g>
  <!-- The waiting marker is a triangle, not a dot, because shape carries the
       meaning here exactly as it does in the sidebar. -->
  <path d="M50 15 L56 25.5 L44 25.5 Z" fill="#FF9F0A"/>
</svg>
