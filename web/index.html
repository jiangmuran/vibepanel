<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>vibepanel</title>
    <script>
      // Applied before first paint. Reading the stored theme in React instead
      // would show one frame of the wrong palette on every load — the flash is
      // brief, but on a dark-room phone it is genuinely unpleasant.
      try {
        var t = localStorage.getItem('vibepanel.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) { /* private mode: fall through to the system preference */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
